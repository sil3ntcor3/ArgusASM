name: Check Build

on:
  pull_request:
    branches:
      - 'main'
      - 'dev'
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: read
  # dorny/paths-filter lists PR files through the REST API.
  pull-requests: read

jobs:
  # Detect file changes
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      console: ${{ steps.filter.outputs.console }}
      core-api: ${{ steps.filter.outputs.core-api }}
      worker: ${{ steps.filter.outputs.worker }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Filter changed files
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            console:
              - 'console/**'
              - 'core-api/package.json'
              - 'console/.dockerignore'
              - 'console/Dockerfile'
              - '.dockerignore'
              - 'pnpm-workspace.yaml'
              - 'pnpm-lock.yaml'
              - '.npmrc'
              - 'package.json'
              - '.github/workflows/build-nightly.yml'
              - '.github/workflows/build-release.yml'
              - '.github/workflows/check-build.yml'
            core-api:
              - 'core-api/**'
              - 'console/package.json'
              - 'core-api/.dockerignore'
              - 'core-api/Dockerfile'
              - '.dockerignore'
              - 'pnpm-workspace.yaml'
              - 'pnpm-lock.yaml'
              - '.npmrc'
              - 'package.json'
              - '.github/workflows/build-nightly.yml'
              - '.github/workflows/build-release.yml'
              - '.github/workflows/check-build.yml'
            worker:
              - 'worker/**'
              - 'worker/.dockerignore'
              - 'worker/Dockerfile'
              - '.github/workflows/build-nightly.yml'
              - '.github/workflows/build-release.yml'
              - '.github/workflows/check-build.yml'

  build-console:
    name: Build Docker - Console
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.console == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image (Console)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: console/Dockerfile
          push: false
          load: true
          tags: sil3ntcor3/argus-console:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-core-api:
    name: Build Docker - Core API
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.core-api == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image (Core API)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: core-api/Dockerfile
          push: false
          load: true
          tags: sil3ntcor3/argus-api:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-worker:
    name: Build Docker - Worker
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.worker == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image (Worker)
        uses: docker/build-push-action@v7
        with:
          context: ./worker
          push: false
          load: true
          tags: sil3ntcor3/argus-worker:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
