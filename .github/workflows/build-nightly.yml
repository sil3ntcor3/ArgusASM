name: Build Argus Development Images

on:
  push:
    branches:
      - "dev"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: sil3ntcor3/argus

jobs:
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev'
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - name: Detect changed services
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v3
        with:
          base: ${{ github.ref }}
          filters: |
            api:
              - 'core-api/**'
              - 'console/package.json'
              - 'pnpm-workspace.yaml'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - '.npmrc'
              - '.dockerignore'
              - '.github/workflows/build-nightly.yml'
            worker:
              - 'worker/**'
              - '.github/workflows/build-nightly.yml'
            console:
              - 'console/**'
              - 'core-api/package.json'
              - 'pnpm-workspace.yaml'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - '.npmrc'
              - '.dockerignore'
              - '.github/workflows/build-nightly.yml'
      - id: set-matrix
        env:
          CHANGES: ${{ steps.filter.outputs.changes }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo 'matrix={"service":["api","worker","console"]}' >> "$GITHUB_OUTPUT"
          elif [ "$CHANGES" = "[]" ]; then
            echo 'matrix={}' >> "$GITHUB_OUTPUT"
          else
            printf 'matrix={"service":%s}\n' "$CHANGES" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build Changed Services
    needs: detect-changes
    runs-on: ubuntu-latest
    # Fail fast instead of hanging for GitHub's default 6h when a buildx/QEMU
    # step stalls (a stalled amd64+arm64 build previously burned the full limit).
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    if: ${{ needs.detect-changes.outputs.matrix != '{}' && needs.detect-changes.outputs.matrix != '' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Login to image repository
        uses: docker/login-action@v4.7.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --push \
            --cache-from=type=registry,ref=${{ env.IMAGE_NAME }}-${{ matrix.service }}:buildcache \
            --cache-to=type=registry,ref=${{ env.IMAGE_NAME }}-${{ matrix.service }}:buildcache,mode=max \
            --build-arg APP_VERSION=dev \
            --tag ${{ env.IMAGE_NAME }}-${{ matrix.service }}:dev \
            --file ./${{ matrix.service == 'api' && 'core-api' || matrix.service }}/Dockerfile \
            ./${{ matrix.service == 'worker' && 'worker' || '.' }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ env.IMAGE_NAME }}-${{ matrix.service }}:dev'
          format: 'sarif'
          output: 'trivy-results.${{ matrix.service }}.sarif'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4.39.1
        with:
          sarif_file: 'trivy-results.${{ matrix.service }}.sarif'
