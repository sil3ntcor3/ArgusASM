name: Build Argus Release

on:
  push:
    #    release:
    #      types: [published]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      fromTag:
        description: 'Generate changelog from this tag (default: previous tag)'
        required: false
        type: string
      toTag:
        description: 'Generate changelog to this tag and create the draft release (required for manual release)'
        required: false
        type: string

concurrency:
  # Keyed on the release target, not the ref. A dispatch resolves github.ref to
  # the branch it was launched from, so every manual release off main shared one
  # group and a second dispatch cancelled the first mid-publish. Serialise on
  # the tag and queue instead of cancelling: a half-published release is worse
  # than a slow one.
  group: ${{ github.workflow }}-${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.toTag || github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: sil3ntcor3/argus

jobs:
  prepare:
    name: Resolve Release Tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      stable: ${{ steps.version.outputs.stable }}
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Validate release version
        id: version
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.toTag }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]] || (( ${#RELEASE_TAG} > 128 )); then
            echo '::error::Provide an existing vMAJOR.MINOR.PATCH[-PRERELEASE] tag (maximum 128 characters, no build metadata).'
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          if [[ "$RELEASE_TAG" == *-* ]]; then
            echo 'stable=false' >> "$GITHUB_OUTPUT"
          else
            echo 'stable=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ steps.version.outputs.tag }}
      - name: Resolve release commit
        id: commit
        run: |
          commit=$(git rev-parse --verify 'HEAD^{commit}')
          echo "sha=$commit" >> "$GITHUB_OUTPUT"

  build-worker-binaries:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'

      - name: Build worker binaries (multi-platform)
        working-directory: worker
        run: |
          platforms=(
            "linux/amd64"
            "linux/arm64"
            "windows/amd64"
            "darwin/amd64"
            "darwin/arm64"
          )

          mkdir -p dist

          for platform in "${platforms[@]}"; do
            GOOS=${platform%/*}
            GOARCH=${platform#*/}
            EXT=""
            if [ "$GOOS" = "windows" ]; then
              EXT=".exe"
            fi
            OUTPUT="dist/oasm-worker-${GOOS}-${GOARCH}${EXT}"
            GOOS=$GOOS GOARCH=$GOARCH CGO_ENABLED=0 go build -ldflags='-s -w' -o "$OUTPUT" ./cmd/cli
          done

          ls -la dist/

      # The body is generated here and passed to the action, rather than left to
      # `generate_release_notes`. softprops' own notes generation resolves to a
      # merge, not a replace: on the update path it falls back to the existing
      # release body (github.ts:688-695) and then appends the freshly generated
      # notes to it (github.ts:242-243) — so re-running this workflow for a tag
      # that already has a draft doubled the notes. An explicit `body_path` is
      # overwritten verbatim on every run, which makes the step idempotent.
      # https://github.com/softprops/action-gh-release/issues/827
      #
      # scripts/release.mjs renders the same markdown the annotated tag carries
      # locally, so the release page and `git show <tag>` can never disagree and
      # there is no third-party action between a commit and its release note.
      # `--to` matters: the tag that triggered this run is already in the
      # checkout, so the range has to be anchored to the tag strictly before it.
      - name: Generate release notes
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          FROM: ${{ inputs.fromTag }}
        run: |
          set -euo pipefail
          args=(--notes-only --to "$TAG" --notes-file release-notes.md)
          [ -n "$FROM" ] && args+=(--from "$FROM")
          node scripts/release.mjs "${args[@]}"
          echo "---"
          cat release-notes.md

      - name: Upload to Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          files: |
            worker/dist/*
          body_path: release-notes.md
          draft: true
          prerelease: ${{ needs.prepare.outputs.stable != 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: prepare
    #    runs-on: self-hosted
    runs-on: ubuntu-latest
    # Fail fast instead of hanging for GitHub's default 6h when a buildx/QEMU
    # step stalls on a multi-arch build.
    timeout-minutes: 45

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        service: [api, worker, console]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}

      - name: Login to image repository
        uses: docker/login-action@v4.7.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --push \
            --cache-from=type=registry,ref=${{ env.IMAGE_NAME }}-${{ matrix.service }}:buildcache \
            --cache-to=type=registry,ref=${{ env.IMAGE_NAME }}-${{ matrix.service }}:buildcache,mode=max \
            --build-arg "APP_VERSION=$RELEASE_TAG" \
            --tag "${{ env.IMAGE_NAME }}-${{ matrix.service }}:$RELEASE_TAG" \
            --file ./${{ matrix.service == 'api' && 'core-api' || matrix.service }}/Dockerfile \
            ./${{ matrix.service == 'worker' && 'worker' || '.' }}
